name: Verify published release
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download official Hub and check published archive
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          THEME_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/monitor-classic-hub"
          cd "$RUNNER_TEMP/monitor-classic-hub"
          gh release download --repo monitor-probe/monitor --pattern monitor-hub-x86_64-unknown-linux-musl --pattern sha256sums.txt
          sha256sum --ignore-missing -c sha256sums.txt
          chmod +x monitor-hub-x86_64-unknown-linux-musl
          git clone --depth 1 https://github.com/monitor-probe/themes.git catalog
          printf 'https://github.com/%s\n' "$THEME_REPOSITORY" > catalog/themes.txt
          cd catalog
          node scripts/build.mjs "$RUNNER_TEMP/monitor-classic-hub/monitor-hub-x86_64-unknown-linux-musl"
