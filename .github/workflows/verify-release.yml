name: Native Komari ZIP release
on:
  push:
    tags: ['komari-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run pack
      - name: Validate tag and publish native ZIP
        if: startsWith(github.ref, 'refs/tags/komari-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e 'const m=JSON.parse(require("fs").readFileSync("komari-theme.json")); if(process.env.GITHUB_REF_NAME !== "komari-v"+m.version) process.exit(1)'
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Komari Classic $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" theme.zip theme.zip.sha256 --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: komari-classic-package
          path: |
            theme.zip
            theme.zip.sha256
