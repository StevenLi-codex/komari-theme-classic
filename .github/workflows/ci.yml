name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run test:ui
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: komari-classic-package
          path: |
            theme.zip
            theme.zip.sha256
